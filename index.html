<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blaze Studio</title>
<style>
:root{--bg:#101114;--panel:#1b1d23;--line:#30333b;--orange:#ff7028;--muted:#9298a3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{height:58px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#191a1f;border-bottom:1px solid var(--line)}
.logo{font-size:20px;font-weight:900}.logo span{color:var(--orange)}
button,.file-label{border:1px solid var(--line);background:#292c33;color:#fff;padding:10px 13px;border-radius:8px;cursor:pointer;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--orange);border-color:var(--orange);color:#171717}
main{max-width:1100px;margin:auto;padding:14px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px}
.preview-panel,.tools,.timeline{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.preview{position:relative;background:#08090b;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px}
video{width:100%;height:100%;object-fit:contain}
#overlay{position:absolute;left:50%;top:75%;transform:translate(-50%,-50%);font-size:36px;font-weight:bold;color:#fff;text-shadow:0 2px 5px #000;text-align:center;pointer-events:none;white-space:pre-wrap;width:90%}
.placeholder{color:var(--muted);text-align:center}
.tools h3,.timeline h3{margin:0 0 12px;font-size:15px}
.tool{margin-bottom:16px}
.tool label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
input[type=text]{width:100%;padding:11px;color:#fff;background:#101216;border:1px solid var(--line);border-radius:7px}
input[type=range]{width:100%;accent-color:var(--orange)}
.timeline{margin-top:12px}
.track{min-height:54px;background:#111318;border:1px solid var(--line);border-radius:7px;padding:9px;margin-top:8px;overflow:hidden}
.clip{background:#a94b25;border:1px solid #ff985f;border-radius:5px;padding:10px;overflow:hidden;white-space:nowrap;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.status{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5}
input[type=file]{display:none}
@media(max-width:700px){.workspace{grid-template-columns:1fr}.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tools h3{grid-column:1/-1}header{padding:0 10px}button,.file-label{padding:9px 10px;font-size:12px}}
</style>
</head>
<body>
<header>
  <div class="logo">BLAZE <span>STUDIO</span></div>
  <button class="primary" id="exportBtn" disabled>Export video</button>
</header>
<main>
  <div class="actions">
    <label class="file-label primary" for="videoInput">＋ Import video</label>
    <input id="videoInput" type="file" accept="video/*">
    <button id="playBtn" disabled>▶ Play</button>
    <button id="pauseBtn" disabled>Ⅱ Pause</button>
  </div>
  <div class="workspace" style="margin-top:12px">
    <section class="preview-panel">
      <div class="preview">
        <div class="placeholder" id="placeholder"><div style="font-size:36px">▶</div>Import a video to begin editing</div>
        <video id="video" playsinline controls hidden></video>
        <div id="overlay"></div>
      </div>
      <div class="status" id="videoInfo">No video imported.</div>
    </section>
    <aside class="tools">
      <h3>Editing tools</h3>
      <div class="tool">
        <label>Trim start (seconds)</label>
        <input id="start" type="range" min="0" max="100" value="0" disabled>
        <div class="status" id="startValue">0.0 s</div>
      </div>
      <div class="tool">
        <label>Trim end (seconds)</label>
        <input id="end" type="range" min="0" max="100" value="100" disabled>
        <div class="status" id="endValue">0.0 s</div>
      </div>
      <div class="tool">
        <label>Text overlay</label>
        <input id="textInput" type="text" placeholder="Enter your text">
      </div>
      <div class="tool">
        <label>Text size</label>
        <input id="textSize" type="range" min="16" max="60" value="36">
      </div>
    </aside>
  </div>
  <section class="timeline">
    <h3>Timeline</h3>
    <div class="status">VIDEO TRACK</div>
    <div class="track"><div class="clip" id="videoClip">No video clip</div></div>
    <div class="status">TEXT TRACK</div>
    <div class="track" id="textTrack">Your text overlay appears here.</div>
  </section>
  <div class="status" id="status">Ready. Import a video to start.</div>
</main>
<script>
const $=id=>document.getElementById(id);
const video=$("video");
let videoURL=null,exporting=false;
function message(t){$("status").textContent=t}
function time(t){if(!Number.isFinite(t))return "0:00";return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0")}
$("videoInput").addEventListener("change",()=>{
  const file=$("videoInput").files[0];if(!file)return;
  if(!file.type.startsWith("video/")){message("Choose a video file.");return}
  if(videoURL)URL.revokeObjectURL(videoURL);
  videoURL=URL.createObjectURL(file);video.src=videoURL;video.hidden=false;$("placeholder").hidden=true;
  video.onloadedmetadata=()=>{
    const d=video.duration;
    if(!Number.isFinite(d)||d<=0){message("Could not read video duration.");return}
    if(d>1500){message("Free prototype limit is 25 minutes.");video.pause();return}
    $("start").min=0;$("start").max=d;$("start").value=0;
    $("end").min=0;$("end").max=d;$("end").value=d;
    $("start").disabled=false;$("end").disabled=false;$("exportBtn").disabled=false;
    $("playBtn").disabled=false;$("pauseBtn").disabled=false;
    $("videoInfo").textContent=file.name+" • "+time(d)+" • "+(file.size/1048576).toFixed(1)+" MB";
    $("videoClip").textContent=file.name+" • "+time(d);updateTrim();
    message("Video imported. Set your trim points.");
  };
  video.onerror=()=>message("This video format could not be opened.");
});
function updateTrim(){
  let a=Number($("start").value),b=Number($("end").value);
  if(a>=b){
    if(document.activeElement===$("start")){a=Math.max(0,b-.1);$("start").value=a}
    else{b=Math.min(video.duration,a+.1);$("end").value=b}
  }
  $("startValue").textContent=a.toFixed(1)+" s";$("endValue").textContent=b.toFixed(1)+" s";
}
$("start").addEventListener("input",updateTrim);$("end").addEventListener("input",updateTrim);
$("playBtn").onclick=async()=>{
  const a=Number($("start").value),b=Number($("end").value);
  if(video.currentTime<a||video.currentTime>=b)video.currentTime=a;
  try{await video.play()}catch(e){message("Tap play on the video.")}
};
$("pauseBtn").onclick=()=>video.pause();
video.addEventListener("timeupdate",()=>{
  if(video.currentTime>=Number($("end").value)&&!video.paused){video.pause();video.currentTime=Number($("start").value)}
});
$("textInput").addEventListener("input",()=>{
  $("overlay").textContent=$("textInput").value;
  $("textTrack").textContent=$("textInput").value||"Your text overlay appears here.";
});
$("textSize").addEventListener("input",()=>{$("overlay").style.fontSize=$("textSize").value+"px"});
async function exportVideo(){
  if(!video.src||exporting)return;
  const a=Number($("start").value),b=Number($("end").value);
  if(b<=a){message("Choose a valid trim range.");return}
  if(!video.captureStream||!HTMLCanvasElement.prototype.captureStream||!window.MediaRecorder){
    message("Export is not supported in this browser. Try the latest Chrome.");return
  }
  exporting=true;$("exportBtn").disabled=true;message("Preparing export...");
  let canvasStream=null,recorder=null,animation=null;
  const oldTime=video.currentTime,wasPaused=video.paused;
  try{
    const canvas=document.createElement("canvas");
    canvas.width=video.videoWidth||1280;canvas.height=video.videoHeight||720;
    const ctx=canvas.getContext("2d");canvasStream=canvas.captureStream(30);
    video.pause();video.currentTime=a;
    await new Promise((resolve,reject)=>{
      if(Math.abs(video.currentTime-a)<.05&&video.readyState>=2){resolve();return}
      const timer=setTimeout(()=>reject(new Error("Video seek timed out.")),8000);
      video.addEventListener("seeked",()=>{clearTimeout(timer);resolve()},{once:true});
    });
    const source=video.captureStream();
    source.getAudioTracks().forEach(t=>canvasStream.addTrack(t));
    const types=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
    const mime=types.find(t=>MediaRecorder.isTypeSupported(t));
    if(!mime)throw new Error("WebM recording is not supported.");
    const chunks=[];
    recorder=new MediaRecorder(canvasStream,{mimeType:mime,videoBitsPerSecond:5000000});
    const finished=new Promise((resolve,reject)=>{
      recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      recorder.onstop=resolve;recorder.onerror=()=>reject(new Error("Recording failed."));
    });
    const text=$("textInput").value,size=Number($("textSize").value);
    function draw(){
      ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);
      if(video.readyState>=2){
        const scale=Math.min(canvas.width/video.videoWidth,canvas.height/video.videoHeight);
        const w=video.videoWidth*scale,h=video.videoHeight*scale;
        ctx.drawImage(video,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
      }
      if(text){
        ctx.font="bold "+size+"px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.lineWidth=Math.max(2,size/12);ctx.strokeStyle="#000";ctx.fillStyle="#fff";
        const words=text.split(" "),lines=[];let line="";
        for(const word of words){
          const test=line?line+" "+word:word;
          if(ctx.measureText(test).width>canvas.width*.85&&line){lines.push(line);line=word}else line=test;
        }
        if(line)lines.push(line);
        const lh=size*1.2,base=canvas.height*.78-(lines.length-1)*lh/2;
        lines.forEach((item,i)=>{const y=base+i*lh;ctx.strokeText(item,canvas.width/2,y);ctx.fillText(item,canvas.width/2,y)});
      }
      if(video.currentTime>=b||video.ended){if(recorder.state==="recording")recorder.stop();return}
      animation=requestAnimationFrame(draw);
    }
    recorder.start(250);await video.play();draw();await finished;
    if(animation)cancelAnimationFrame(animation);video.pause();
    if(!chunks.length)throw new Error("No video data was recorded.");
    const blob=new Blob(chunks,{type:mime}),url=URL.createObjectURL(blob);
    const link=document.createElement("a");link.href=url;link.download="blaze-studio-export.webm";
    document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
    message("Export finished. Check your Downloads folder.");
    video.currentTime=oldTime;if(!wasPaused)video.play().catch(()=>{});
  }catch(e){
    if(animation)cancelAnimationFrame(animation);
    if(recorder&&recorder.state!=="inactive")recorder.stop();
    message("Export failed: "+e.message);video.pause();video.currentTime=oldTime;
  }finally{
    if(canvasStream)canvasStream.getTracks().forEach(t=>t.stop());
    exporting=false;$("exportBtn").disabled=!video.src;
  }
}
$("exportBtn").addEventListener("click",exportVideo);
</script>
</body>
</html>
